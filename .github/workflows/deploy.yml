name: Deploy DefectRadar

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".env.example"
      - "DefectRadar/**"
      - "publications/**"
      - "scraps/**"
      - "tailwind.config.js"
  workflow_dispatch:

concurrency:
  group: deploy-defectradar
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: defectradar-site-272594900302
  EC2_INSTANCE_ID: i-04e39a795576e33f0
  SITE_DIR: /home/ubuntu/SecondLayer/deployment/static/defectradar

jobs:
  deploy:
    name: Sync to S3 + pull on secondlayer-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Stage site files
        run: |
          mkdir -p _site/research/culture
          cp Radar.html _site/index.html
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp research/index.html _site/research/
          cp research/culture/index.html _site/research/culture/
          cp research/culture/credit-industries-tautology.html _site/research/culture/
          ls -laR _site

      - name: Sync to S3
        run: |
          aws s3 sync _site/ s3://$S3_BUCKET/ \
            --cache-control "public, max-age=300" \
            --exclude "*.md" \
            --exclude ".git/*"

      - name: Pull to secondlayer-prod via SSM
        id: ssm
        run: |
          jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg dir "$SITE_DIR" \
            --arg sha "$GITHUB_SHA" \
            '{
              commands: [
                "aws s3 sync \"s3://\($bucket)/\" \"\($dir)/\"",
                "echo Deploy complete: \($sha)"
              ]
            }' > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DefectRadar from S3 ($GITHUB_SHA)" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "SSM command: $CMD_ID"

      - name: Wait for SSM command
        run: |
          aws ssm wait command-executed \
            --command-id ${{ steps.ssm.outputs.cmd_id }} \
            --instance-id $EC2_INSTANCE_ID || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id ${{ steps.ssm.outputs.cmd_id }} \
            --instance-id $EC2_INSTANCE_ID \
            --query "Status" --output text)
          STDOUT=$(aws ssm get-command-invocation \
            --command-id ${{ steps.ssm.outputs.cmd_id }} \
            --instance-id $EC2_INSTANCE_ID \
            --query "StandardOutputContent" --output text)
          STDERR=$(aws ssm get-command-invocation \
            --command-id ${{ steps.ssm.outputs.cmd_id }} \
            --instance-id $EC2_INSTANCE_ID \
            --query "StandardErrorContent" --output text)
          echo "Status: $STATUS"
          echo "--- stdout ---"
          echo "$STDOUT"
          echo "--- stderr ---"
          echo "$STDERR"
          [ "$STATUS" = "Success" ]

      - name: Verify site
        run: |
          echo "=== /robots.txt ==="
          curl -fsS https://defectradar.legal.org.ua/robots.txt | head -5
          echo ""
          echo "=== /sitemap.xml ==="
          curl -fsS https://defectradar.legal.org.ua/sitemap.xml | head -5
          echo ""
          echo "=== article HTTP 200 ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            https://defectradar.legal.org.ua/research/culture/credit-industries-tautology.html
